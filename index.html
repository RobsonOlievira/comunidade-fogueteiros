<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Comunidade Olha o Foguete! Vibe Coding - O espaço definitivo para criadores e entusiastas de tecnologia impulsionados por Inteligência Artificial.">
    <title>Comunidade Olha o Foguete! Vibe Coding</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #070314;
            --text-color: #f5f3ff;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        h1, h2, h3, h4, h5, h6, button, .font-display {
            font-family: 'Rajdhani', sans-serif;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #8a2be2; }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'var(--bg-color)',
              surface: '#0b0520',
              primary: '#8a2be2',
              'primary-hover': '#7c3aed',
              'accent-cyan': '#00e5ff',
              'accent-pink': '#ff007f',
              'accent-green': '#39ff14',
              glass: 'rgba(255, 255, 255, 0.05)',
              'glass-border': 'rgba(255, 255, 255, 0.08)',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Rajdhani', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
<body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
