    <style>
        :root {
            --bg-color: #070314;
            --text-color: #f5f3ff;
        }
        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }
        h1, h2, h3, h4, h5, h6, button, .font-display {
            font-family: 'Rajdhani', 'Inter', -apple-system, sans-serif;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #8a2be2; }

        #cf-boot-splash {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: var(--bg-color);
            color: var(--text-color);
            z-index: 9999;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }
        #cf-boot-splash.gone { opacity: 0; }
        #cf-boot-splash .ring {
            width: 36px; height: 36px;
            border: 3px solid rgba(187,159,255,0.15);
            border-top-color: #bb9fff;
            border-radius: 50%;
            animation: cf-spin 0.8s linear infinite;
        }
        #cf-boot-splash .label {
            font: 500 13px/1 'Inter', sans-serif;
            letter-spacing: 0.05em;
            color: rgba(245,243,255,0.6);
        }
        @keyframes cf-spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased">
    <div id="cf-boot-splash" aria-hidden="true">
        <div class="ring"></div>
        <div class="label">CARREGANDO COMUNIDADE</div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Esconde splash quando React montou
      window.addEventListener('cf:app-ready', function () {
        var s = document.getElementById('cf-boot-splash');
        if (s) {
          s.classList.add('gone');
          setTimeout(function(){ s.parentNode && s.parentNode.removeChild(s); }, 300);
        }
      });
      // Fallback de seguranca: apÃ³s 8s esconde splash mesmo se React nao sinalizou
      setTimeout(function(){
        window.dispatchEvent(new Event('cf:app-ready'));
      }, 8000);
    </script>

    <!-- Google Tag Manager carregado lazy, sem bloquear render -->

          new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
          'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
          })(window,document,'script','dataLayer','GTM-NKL8X6N4');
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGTM, { timeout: 3500 });
        } else {
          setTimeout(loadGTM, 1500);
        }
      })();
    </script>
    <!-- End Google Tag Manager -->
</body>
